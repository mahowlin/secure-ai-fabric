# NAC ACI Modules — tenant and the example site access-policy management
#
# Enables tenant-scoped resources plus selected access-policy resources needed
# for the example site existing access-policy adoption. Fabric, pod, node, and unrelated
# interface/policy categories remain disabled.
# Keys are NAC Terraform resource names (merged into local.modules).
# See terraform-aci-nac-aci/defaults/modules.yaml for full list.

modules:
